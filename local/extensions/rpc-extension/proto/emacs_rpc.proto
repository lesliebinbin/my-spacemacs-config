// Wire contract for the Emacs RPC bridge (runbook/emacs-rpc-bridge/
// design-001.org).  This is the LIVE schema: the extension's CMake build
// runs protoc over it (build/generated) for the C++ module and harness,
// and the independent Python consumer (design-001.org TODO 5,
// ~/codings/emacs-rpc-py-client-test) regenerates its own stubs from this
// same file with grpc_tools.protoc.  No generated code is checked in.
//
// Design notes encoded below (see design-001.org TODO 2 for the rationale):
//   - Clients hold opaque, session-scoped handles, never copies of internal
//     C structs; emacs_value / pointers are never serialized.
//   - Symbols are not strings; unibyte bytes are not UTF-8 text.
//   - Reject out-of-range integers instead of truncating (uint64/sint64).
//   - A symbol name is interned locally at dispatch time; an explicit Intern
//     RPC is deliberately omitted (Call already combines lookup + invocation).
//   - Wire failures are reported as gRPC status; Emacs signals/throws travel
//     inside Error with their symbol/tag preserved.
//   - Remote callbacks (RegisterCallback) are deferred to design TODO 6.
syntax = "proto3";

package emacs.rpc.v1;

// Service exposed by the local Emacs-side bridge endpoint.
//
// Transport/lifetime notes: one Unix-domain socket in a private per-user
// runtime directory; sessions are application-level (a gRPC channel alone
// does not define session lifetime).  Inactivity leases and per-session
// quotas are enforced bridge-side and are not modeled here.
service EmacsRpc {
  // OpenSession negotiates the protocol version and returns a session
  // identity.  The caller must CloseSession when done.
  rpc OpenSession(OpenSessionRequest) returns (OpenSessionResponse);

  // Call invokes a Lisp function by name with typed arguments.  Compound or
  // live objects are returned as handles.
  rpc Call(CallRequest) returns (CallResponse);

  // WithBuffer runs a bounded sequence of calls with a buffer bound as
  // current, restoring the previous current buffer on success and error.
  rpc WithBuffer(WithBufferRequest) returns (WithBufferResponse);

  // ReleaseHandles explicitly releases session-owned references.
  rpc ReleaseHandles(ReleaseHandlesRequest) returns (ReleaseHandlesResponse);

  // CloseSession queues reference cleanup on the Emacs thread and stops
  // accepting further requests for this session.
  rpc CloseSession(CloseSessionRequest) returns (CloseSessionResponse);
}

// ---- session lifecycle -----------------------------------------------------

message OpenSessionRequest {
  // Highest protocol version the client speaks.  The server answers with the
  // version it will use, which may be lower.
  int32 protocol_version = 1;
}

message OpenSessionResponse {
  string session_id = 1;      // opaque token for all later requests
  int32 protocol_version = 2; // version in effect for this session
  string emacs_version = 3;   // informational: (emacs-version)
}

message CloseSessionRequest {
  string session_id = 1;
}

message CloseSessionResponse {}

message ReleaseHandlesRequest {
  string session_id = 1;
  repeated Handle handles = 2;
}

message ReleaseHandlesResponse {}

// ---- values ----------------------------------------------------------------

// A typed value crossing the bridge.  Exactly one kind is set.
// Initial policy (TODO 2): unsupported / compound / live objects come back
// as handles, and Call arguments may name them by handle.
message Value {
  oneof kind {
    bool nil_value = 1;          // Lisp nil (distinct from the boolean)
    bool true_value = 2;         // Lisp t
    sint64 integer = 3;          // signed 64-bit; out-of-range is rejected
    double real = 4;             // Lisp float
    string text = 5;             // UTF-8 string
    bytes unibyte = 6;           // unibyte data; not text
    string symbol_name = 7;      // interned at dispatch time
    Handle handle = 8;           // session-scoped opaque reference
  }
}

message Handle {
  // Opaque id, unique within the owning session.  Never an address or an
  // emacs_value.  Do not trust a handle from a different session.
  uint64 id = 1;
  // Informational kind ("buffer", "window", "frame", ...); advisory only,
  // not type validation.
  string kind = 2;
}

// Emacs signals/throws, structured: symbol/tag plus representable data and a
// readable fallback.  This is distinct from transport/gRPC failures.
message Error {
  string symbol = 1;   // error symbol name, e.g. "wrong-type-argument"
  string tag = 2;      // error tag when it differs from the symbol
  Value data = 3;      // representable error data, when available
  string message = 4;  // readable fallback description
}

// ---- calls -----------------------------------------------------------------

message CallOp {
  string function_name = 1;      // e.g. "get-buffer-create"; interned locally
  repeated Value arguments = 2;
}

message CallRequest {
  string session_id = 1;
  uint64 correlation_id = 2;     // echoed back; clients match async replies
  CallOp op = 3;
}

message CallResponse {
  uint64 correlation_id = 1;
  oneof result {
    Value value = 2;   // typed result; live/compound objects arrive as handles
    Error error = 3;   // Emacs signal or throw
  }
}

message WithBufferRequest {
  string session_id = 1;
  uint64 correlation_id = 2;
  Handle buffer = 3;   // buffer to bind as current for the whole sequence
  // Executed in one dispatch under save-current-buffer.  A failing op stops
  // the sequence (initial policy; see TODO 4); earlier effects are not
  // rolled back — this is contextual grouping, not a transaction.
  repeated CallOp calls = 4;
}

message WithBufferResponse {
  uint64 correlation_id = 1;
  // One entry per executed op; the first entry carrying an error ends the
  // sequence (a failing op stops later ones).  Siblings rather than a oneof:
  // "results" is repeated, and protobuf forbids repeated fields in oneofs.
  repeated CallResponse results = 2;
  // Failure before any op ran (unknown session, dead buffer handle).
  Error error = 3;
}
