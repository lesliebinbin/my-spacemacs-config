// An explicit target prevents silent assumptions about bytecode compatibility.
message BytecodeArtifact {
  uint32 schema_version = 1; // Must be 1.
  string emacs_version = 2; // Initial supported target: "31.1".
  CompiledFunction function = 3;
}

// Corresponds to #[ARGLIST CODE CONSTANTS STACK_DEPTH DOC INTERACTIVE].
// Absence of a oneof/message field differs from an explicitly encoded Lisp nil.
message CompiledFunction {
  oneof arguments {
    // mandatory | (has_rest ? 128 : 0) | (nonrest << 8).
    uint64 lexical_argument_template = 1;
    // A proper list of parameter symbols, including &optional / &rest markers.
    LispValue dynamic_argument_list = 2;
  }
  bytes instructions = 3; // Unibyte code, including operand bytes.
  repeated LispValue constants = 4; // Materialized as an Emacs vector.
  uint32 max_stack = 5;
  LispValue documentation = 6; // Absent, nil, string, or doc-file integer offset.
  LispValue interactive = 7; // Absent, nil, string, or a Lisp expression.
}

// Portable Lisp data. One variant MUST be selected, recursively.
// This tree format does not preserve sharing/cycles or live runtime handles.
message LispValue {
  oneof value {
    Nil nil_value = 1;
    Truth true_value = 2;
    sint64 integer_value = 3;
    double float_value = 4;
    string text = 5; // Unicode string, without text properties.
    bytes unibyte_string = 6; // Arbitrary 8-bit Lisp string.
    string symbol_name = 7; // Intern in the receiving Emacs obarray.
    Cons cons = 8;
    Vector vector = 9;
    CompiledFunction compiled_function = 10;
    string big_integer_decimal = 11; // Canonical signed decimal integer.
  }
}
message Nil {}
message Truth {}
message Cons {
  LispValue car = 1;
  LispValue cdr = 2;
}
message Vector {
  repeated LispValue elements = 1;
}
